<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Galeria de Fotos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
        }

        .erro {
            color: #d32f2f;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin</h1>
        <p>Digite a senha para acessar a galeria</p>

        <input type="password" id="senha" placeholder="Senha" onkeypress="if(event.key==='Enter') acessar()">
        <button onclick="acessar()">Acessar</button>

        <div class="erro" id="erro">Senha incorreta</div>
    </div>

    <script>
        function acessar() {
            const senha = document.getElementById('senha').value;

            if (!senha) {
                mostrarErro('Digite a senha');
                return;
            }

            // Redirecionar com token
            window.location.href = `/galeria.html?token=${senha}`;
        }

        function mostrarErro(msg) {
            const erro = document.getElementById('erro');
            erro.textContent = msg;
            erro.style.display = 'block';
        }
    </script>
</body>
</html>
