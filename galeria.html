<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .voltar {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .voltar:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .foto-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .foto-card:hover {
            transform: translateY(-5px);
        }

        .foto-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .foto-info {
            padding: 15px;
            background: white;
        }

        .foto-nome {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .foto-data {
            font-size: 12px;
            color: #999;
        }

        .mensagem {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 20px;
        }

        .carregando {
            text-align: center;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="voltar">← Voltar</a>
        <h1>📷 Galeria de Fotos</h1>

        <div class="mensagem" id="aviso">
            ⚠️ Nota: No Vercel, as fotos são temporárias e desaparecem após algumas horas.
        </div>

        <div id="carregando" class="carregando" style="display:none;">
            Carregando fotos...
        </div>

        <div class="galeria" id="galeria"></div>
    </div>

    <script>
        carregarFotos();

        function carregarFotos() {
            document.getElementById('carregando').style.display = 'block';

            fetch('/fotos')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('carregando').style.display = 'none';

                    if (data.sucesso && data.fotos.length > 0) {
                        document.getElementById('aviso').style.display = 'none';
                        mostrarFotos(data.fotos);
                    } else {
                        document.getElementById('galeria').innerHTML = 
                            '<div class="mensagem" style="grid-column: 1/-1;">Nenhuma foto encontrada</div>';
                    }
                })
                .catch(erro => {
                    console.error('Erro:', erro);
                    document.getElementById('galeria').innerHTML = 
                        '<div class="mensagem" style="grid-column: 1/-1;">Erro ao carregar fotos</div>';
                    document.getElementById('carregando').style.display = 'none';
                });
        }

        function mostrarFotos(fotos) {
            const galeria = document.getElementById('galeria');
            galeria.innerHTML = fotos.map(foto => `
                <div class="foto-card">
                    <img src="/fotos/${foto}" alt="Foto">
                    <div class="foto-info">
                        <div class="foto-nome">${foto}</div>
                        <div class="foto-data">📅 ${new Date().toLocaleDateString('pt-BR')}</div>
                    </div>
                </div>
            `).join('');
        }

        // Recarregar a cada 5 segundos
        setInterval(carregarFotos, 5000);
    </script>
</body>
</html>
